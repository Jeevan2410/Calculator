<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <meta name="description" content="A calculator with live answers, history, keyboard support and a little 3D motion." />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem("calc:theme")) ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

    <main class="stage">
      <section class="calc" id="calc" aria-label="Calculator">
        <div class="shine" aria-hidden="true"></div>

        <header class="calc-bar">
          <button class="chip" id="history-toggle" type="button" aria-label="History" aria-expanded="false" aria-controls="history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v4h4" /><path d="M12 7v5l3 2" /></svg>
          </button>
          <span class="brand" aria-hidden="true">calc</span>
          <button class="chip" id="theme" type="button" aria-label="Switch theme">
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
          </button>
        </header>

        <div class="display" id="display">
          <div class="equation" id="equation"></div>
          <output class="main" id="main" title="Click to copy">0</output>
          <div class="preview" id="preview"></div>
          <span class="copied" id="copied" aria-hidden="true">Copied</span>
        </div>

        <div class="keypad" id="keypad">
          <button type="button" class="fn" data-key="clear" aria-label="All clear">AC</button>
          <button type="button" class="fn" data-key="back" aria-label="Delete">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z" /><path d="m12 9 6 6m0-6-6 6" /></svg>
          </button>
          <button type="button" class="fn" data-key="%" aria-label="Percent">%</button>
          <button type="button" class="op" data-key="/" aria-label="Divide">÷</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" class="op" data-key="*" aria-label="Multiply">×</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" class="op" data-key="-" aria-label="Minus">−</button>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" class="op" data-key="+" aria-label="Plus">+</button>
          <button type="button" class="fn" data-key="()" aria-label="Brackets">( )</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="." aria-label="Decimal point">.</button>
          <button type="button" class="eq" data-key="=" aria-label="Equals">=</button>
        </div>

        <section class="history" id="history" aria-label="History">
          <header>
            <h2>History</h2>
            <div>
              <button type="button" class="text-btn" id="history-clear">Clear</button>
              <button type="button" class="text-btn" id="history-close" aria-label="Close history">Done</button>
            </div>
          </header>
          <ol id="history-list"></ol>
          <p class="history-empty" id="history-empty">Your calculations will appear here.</p>
        </section>
      </section>

      <p class="hint">
        Works from the keyboard too: <kbd>0–9</kbd> <kbd>+ − * /</kbd> <kbd>%</kbd> <kbd>( )</kbd> <kbd>Enter</kbd>
        <kbd>⌫</kbd> <kbd>Esc</kbd>. Paste a sum with <kbd>Ctrl</kbd>+<kbd>V</kbd>, copy the answer with <kbd>Ctrl</kbd>+<kbd>C</kbd>.
      </p>
    </main>

    <p class="visually-hidden" id="announce" aria-live="polite"></p>
  </body>
</html>
